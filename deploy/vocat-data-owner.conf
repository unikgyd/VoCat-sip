# Install as /etc/systemd/system/vocat.service.d/data-owner.conf.
# Both services must use the same binary, database, network namespace and /run.
[Unit]
Wants=vocat-data-owner.service vocat-qmi-proxy.service
After=vocat-data-owner.service vocat-qmi-proxy.service

[Service]
# Keep the main process alive across proxy restart, while refusing initial
# startup when the dedicated proxy service or its socket is not ready.
ExecStartPre=systemctl --quiet is-active vocat-qmi-proxy.service
ExecStartPre=/opt/vocat/bin/vocat qmi-proxy --check
Environment=VOCAT_DATA_OWNER_SOCKET=/run/vocat/data-owner.sock
