# Install as /etc/systemd/system/vocat.service.d/data-owner.conf.
# Both services must use the same binary, database, network namespace and /run.
[Unit]
Wants=vocat-data-owner.service
Requires=vocat-qmi-proxy.service
After=vocat-data-owner.service vocat-qmi-proxy.service

[Service]
Environment=VOCAT_DATA_OWNER_SOCKET=/run/vocat/data-owner.sock
