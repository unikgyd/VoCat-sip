# docker compose -f docker-compose.yml -f compose.data-owner.yaml up -d --build
# Both services use the same candidate image and shared persistent volume.
services:
  vocat:
    environment:
      VOCAT_DATA_OWNER_SOCKET: /run/vocat/data-owner.sock
    depends_on:
      vocat-data-owner:
        condition: service_started
  vocat-data-owner:
    image: ghcr.io/mengmengcode/vocat:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocat-data-owner
    entrypoint: ["/opt/vocat/bin/vocat", "data-owner"]
    restart: unless-stopped
    stop_grace_period: 120s
    network_mode: host
    pid: host
    privileged: true
    user: "0:0"
    environment:
      VOCAT_CONTAINER: docker
      VOCAT_DATA_OWNER_SOCKET: /run/vocat/data-owner.sock
    volumes:
      - vocat-data:/opt/vocat/data
      - /dev:/dev
      - /sys:/sys:ro
      - /sys/devices:/sys/devices:rw
      - /run/dbus:/run/dbus:ro
      - /run/vocat:/run/vocat
      - /run/lock:/run/lock
